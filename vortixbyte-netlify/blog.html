<!DOCTYPE html>
<html lang="es">
<head>
  <script>location.replace('index.html#catalog' + location.search);</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · VORTIXBYTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="assets/css/vortix.css" rel="stylesheet">
</head>
<body>
  <main>
    <div class="wrap page-title">
      <div data-aos="fade-down" data-aos-duration="700">
        <div class="kicker">BUSCADOR DE TIENDA</div>
        <h1 class="brand">Catálogo</h1>
        <p class="lede">Como la vitrina de una consola: filtra por plataforma o escribe el nombre. Al abrir un producto ves la ficha, un video corto de la tienda y el botón de compra.</p>
      </div>
      <div class="filters" data-aos="fade-up" data-aos-delay="80">
        <input id="filter-q" placeholder="Buscar juego o aparato" aria-label="Buscar">
        <select id="filter-plat" aria-label="Plataforma">
          <option value="todas">Todas las plataformas</option>
          <option>Switch</option>
          <option>PlayStation</option>
          <option>Xbox</option>
          <option>Roblox</option>
          <option>Fortnite</option>
        </select>
        <select id="filter-kind" aria-label="Tipo">
          <option value="todos">Todo</option>
          <option value="game">Videojuegos</option>
          <option value="hardware">Consolas</option>
        </select>
        <span class="meta" id="count"></span>
      </div>
      <div class="grid" id="catalog-grid"></div>
    </div>
  </main>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/app.js"></script>
  <script>Vortix.mount("catalog"); Vortix.catalog();</script>
</body>
</html>
